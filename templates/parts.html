{% extends "base.html" %}
{% block content %}
    <h1>All Parts</h1>
    <!-- search bar -->
        <form class="search-bar" method="post" action="/search">
            <label for="search">Search for a part:</label>
            <input type="text" id="search" name="search">
           <input class="button" type="submit" value="Search">
        </form>

    </div>


    

<!-- filter options using form-->
 <form class="filter-options" method="get" action="/parts">
    <h2>Filters</h2>
    
     <div class="filter-category">
    <label for="filter-category">Category:</label>
    <select name="category">
        <option value="">All categories</option>
        <option value="CPU">CPU</option>
        <option value="GPU">GPU</option>
        <option value="RAM">RAM</option>
       
    </select>
    </div>

    <div class="filter-brand">
    <label for="filter-brand">Brand:</label>
    <select name="brand">
        <option value="">All Brands</option>
        <option value="amd">AMD</option>
        <option value="intel">Intel</option>
        <option value="nvidia">NVIDIA</option>
        <option value="corsair">Corsair</option>
        <option value="kingston">Kingston</option>
        <option value="gigabyte">Gigabyte</option>
    </select>
    </div>

    <div class="filter-price-tier">
    <label for="filter-price_tier">Price Tier:</label>
    <select name="price_tier">
        <option value="">All Price Points</option>
        <option value="1">Budget</option>
        <option value="2">Mid-Range</option>
        <option value="3">High-End</option>
    </select>
    </div>

    <div class="filter-sort">
    <label for="filter-sort">Sort By:</label>
    <select name="sort">
        <option value="">Default</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="name_asc">Name: A-Z</option>
        <option value="name_desc">Name: Z-A</option>
        <option value="rating">Rating</option>
        <option value="release_year_asc">Release Year (Oldest First)</option>
        <option value="release_year_desc">Release Year (Newest First)</option>
    </select>
    </div>





    <input type="submit" value="filter results">
 </form>


<!-- for loop to display all the parts -->

    {% for part in results %}
    <a href="/detail/{{ part[0] }}" class="part-link">
        <div class="carded-parts">
            <img src="{{ url_for('static', filename=part[1]) }}" alt="{{ part[2] }}">
            <h2>{{ part[2] }}</h2> <!-- name -->
            <h3>{{ part[4] }}</h3> <!-- brand -->
            <h3 class="part-category">{{ part[3] }}</h3> <!-- category -->
            <h3 class="part-price">${{ part[5] }}</h3> <!-- price -->
        </div>
    </a>
    {% else %}
        <p>No products match your selected filters. Try changing your category, brand, or price tier.</p>
    {% endfor %}
{% endblock %}
