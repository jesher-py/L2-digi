{% extends 'base.html' %}
{% block content %}

<div class="slogan">
   <h1>Find the best PC part, <br> every time</h1>
</div>

<a class="button" href="/parts">View All Parts</a>

 <form class="home-search-bar" method="post" action="/search">
            <label for="search">Search for a part:</label>
            <input type="text" id="search" name="search">
           <input  type="submit" value="Search">
        </form>


<h1 class="featured">featured Parts:</h1>
 
    {% for part in results %}
    <a href="/detail/{{ part[0] }}" class="part-link">
        <div class="carded-parts">
            <img src="{{ url_for('static', filename=part[1]) }}" alt="{{ part[2] }}">
            <h2>{{ part[2] }}</h2> <!-- name -->
            <h3>{{ part[4] }}</h3> <!-- brand -->
            <h3 class="part-category">{{ part[3] }}</h3> <!-- category -->
            <h3 class="part-price">${{ part[5] }}</h3> <!-- price -->
        </div>
    </a>


 
 
{% endfor %}
{% endblock %}
